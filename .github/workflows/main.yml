name: Download ALL Reciters

on:
  workflow_dispatch:

jobs:
  download-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install
        run: pip install requests
        
      - name: Download ALL Fast
        run: |
          python3 << 'PY'
          import requests, os
          from concurrent.futures import ThreadPoolExecutor
          
          RECITERS = [
              "Husary_64kbps", "Husary_128kbps",
              "Alafasy_64kbps", "Ghamadi_64kbps", "Sudais_64kbps",
              "Shuraim_64kbps", "Maher_64kbps", "Ajamy_64kbps",
              "Menshawy_64kbps", "Abdul_Baset_64kbps", "Hudhaify_64kbps",
              "Shatri_64kbps", "Qatami_64kbps", "Dosari_64kbps"
          ]
          
          BASE = "https://quran.ksu.edu.sa/ayat/mp3"

          def download_one_file(args):
              reciter, fname = args
              folder = f"quran/{reciter}"
              os.makedirs(folder, exist_ok=True)
              path = os.path.join(folder, fname)
              if os.path.exists(path):
                  return
              url = f"{BASE}/{reciter}/{fname}"
              try:
                  r = requests.get(url, timeout=15)
                  if r.status_code == 200 and len(r.content) > 1000:
                      with open(path, "wb") as f:
                          f.write(r.content)
                      print(f"OK {fname} -> {reciter}")
              except:
                  pass

          def process_ayah(sura_aya):
              sura, aya = sura_aya
              fname = f"{sura:03d}{aya:03d}.mp3"
              # هاي النقطة المهمة: نفس الآية لكل القراء سوة
              jobs = [(rec, fname) for rec in RECITERS]
              with ThreadPoolExecutor(max_workers=20) as inner:
                  inner.map(download_one_file, jobs)

          # من اول اية لاخر اية
          all_ayahs = [(s, a) for s in range(1, 115) for a in range(1, 287)]
          
          print(f"Downloading {len(all_ayahs)} ayahs x {len(RECITERS)} reciters")
          # يروح آية آية وكل آية يجيب كل القراء سوة
          with ThreadPoolExecutor(max_workers=100) as ex:
              ex.map(process_ayah, all_ayahs)
          PY
          
      - name: Push to GitHub
        run: |
          git config user.name "quran-bot"
          git config user.email "bot@github.com"
          git add quran/
          git commit -m "Add ALL reciters fast parallel" || echo "no changes"
          git push
