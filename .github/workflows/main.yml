name: Download Quran from KSU

on:
  workflow_dispatch:
    inputs:
      reciter:
        description: 'اسم القارئ'
        required: true
        default: 'Husary_64kbps'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: pip install requests
        
      - name: Download Ayahs
        run: |
          mkdir -p quran/${{ github.event.inputs.reciter }}
          python3 << 'PY'
          import requests, os
          from concurrent.futures import ThreadPoolExecutor

          reciter = "${{ github.event.inputs.reciter }}"
          ayah_count = [7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6]
          base = "https://quran.ksu.edu.sa/ayat/mp3"

          def dl(args):
              s,a = args
              fname = f"{s:03d}{a:03d}.mp3"
              path = f"quran/{reciter}/{fname}"
              if os.path.exists(path): return
              url = f"{base}/{reciter}/{fname}"
              try:
                  r = requests.get(url, timeout=20)
                  if r.status_code == 200:
                      with open(path, "wb") as f: f.write(r.content)
                      print(f"OK {fname}")
              except Exception as e:
                  print(f"FAIL {fname} {e}")

          tasks = []
          for s,c in enumerate(ayah_count,1):
              for a in range(1,c+1):
                  tasks.append((s,a))

          with ThreadPoolExecutor(max_workers=20) as ex:
              ex.map(dl, tasks)
          PY
          
      - name: Push to GitHub
        run: |
          git config user.name "quran-bot"
          git config user.email "bot@github.com"
          git add quran/
          git commit -m "Add ${{ github.event.inputs.reciter }}" || echo "no changes"
          git push
